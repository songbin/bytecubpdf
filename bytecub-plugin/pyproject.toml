[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["babeldoc", "ai_enginee", "pdf2zh", "controller", "model", "services", "utils", "config"]

[project]
name = "bytecub-plugin"
version = "0.1.0"
description = "Bytecub PDF Plugin - A comprehensive PDF processing and translation tool"
authors = [
    {name = "Bytecub Team"}
]
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
dependencies = [
    "azure-ai-translation-text==1.0.1",
    "bitstring>=4.3.0",
    "configargparse>=1.7",
    "deepl",
    "doclayout-yolo==0.0.3",
    "fonttools",
    "freetype-py>=2.5.1",
    "gradio",
    "gradio-pdf==0.0.21",
    "huggingface-hub>=0.27.0",
    "httpx[socks]>=0.27.0",
    "modelscope",
    "msgpack>=1.1.0",
    "numpy>=2.0.2",
    "ollama",
    "onnx>=1.17.0",
    "onnxruntime>=1.16.1",
    "openai>=1.59.3",
    "opencv-python-headless",
    "opencv-python>=4.10.0.84",
    "orjson>=3.10.14",
    "peewee>=3.17.8",
    "pikepdf",
    "pymupdf==1.25.1",
    "python-dotenv",
    "python-levenshtein>=0.27.1",
    "pdfminer.six==20250416",
    "pydantic>=2.10.6",
    "requests",
    "rich>=13.9.4",
    "scikit-image>=0.25.2",
    "tenacity>=9.0.0",
    "tencentcloud-sdk-python",
    "tiktoken>=0.9.0",
    "toml>=0.10.2",
    "torch==2.5.1",
    "torchvision",
    "tqdm>=4.67.1",
    "werkzeug==2.2.2",
    "xsdata[cli,lxml,soap]>=24.12",
    "xinference-client",
    "rapidocr-onnxruntime>=1.3.7",
    "requests==2.31.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.1,<0.28.0",
    "httpx==0.27.2",
    "sse-starlette==2.0.0",
    "markdown==3.8",
    "python-docx==1.1.2",
    "beautifulsoup4==4.13.4",
    "pylatexenc==2.10",
    "matplotlib==3.10.1",
    "pillow==11.2.1",
    "pyzstd>=0.17.0",
    "rtree>=1.4.0",
    "chardet>=5.2.0",
    "scipy>=1.15.3",
    "uharfbuzz>=0.50.2",
    "py-spy>=0.4.0",
    # "pip>=25.3",
    # BabelDOC核心依赖
    "charset-normalizer >= 2.0.0",
    "cryptography >= 36.0.0",
    "psutil>=7.0.0",
    "scikit-learn>=1.7.1",
    "hyperscan>=0.7.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
]
# GPU支持选项
directml = ["onnxruntime-directml>=1.16.1"]
cuda = ["onnxruntime-gpu>=1.16.1"]
# 内存分析工具
memray = ["memray>=1.17.1"]

[project.scripts]
bytecub-plugin = "main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
    "pyinstaller>=6.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


